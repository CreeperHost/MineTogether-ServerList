plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id "net.neoforged.moddev"
}

neoForge {
    version = rootProject.neoforge_version
    validateAccessTransformers = true

    def accessTransformer = project(":common").file("src/main/resources/META-INF/accesstransformer.cfg")
    if (accessTransformer.exists()) {
        accessTransformers {
            from accessTransformer
            publish accessTransformer
        }
    }

    runs {
        client {
            client()
            gameDirectory = file("runs/client")
        }
        server {
            server()
            gameDirectory = file("runs/server")
            programArgument "--nogui"
        }
    }

    mods {
        "minetogetherservers" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
    quackRuntimeSource {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
    shadowLib
    implementation.extendsFrom shadowLib
    runtimeClasspath {
        exclude group: "net.covers1624", module: "Quack"
    }
}

def sanitizedQuack = tasks.register("sanitizeQuackForDev", Jar) {
    archiveFileName = "Quack-dev-runtime.jar"
    destinationDirectory = layout.buildDirectory.dir("runtime-libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.quackRuntimeSource.collect { zipTree(it) }
    }

    exclude "META-INF/MANIFEST.MF"
    exclude "META-INF/*.SF"
    exclude "META-INF/*.RSA"
    exclude "META-INF/*.DSA"
}

dependencies {
    implementation("net.creeperhost.polylib:polylib-neoforge:${polylib_version}") {
        transitive = false
    }
    accessTransformers "net.creeperhost.polylib:polylib-neoforge:${polylib_version}"

    commonJava project(path: ":common", configuration: "commonJava")
    commonResources project(path: ":common", configuration: "commonResources")

    shadowLib "blue.endless:jankson:${jankson_version}"
    shadowLib("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    shadowLib("net.creeperhost:MineTogetherSessions:${mtsession_version}") {
        transitive = false
    }
    quackRuntimeSource "net.covers1624:Quack:${quack_version}"
    runtimeOnly files(sanitizedQuack)
    shadowLib "org.nanohttpd:nanohttpd:2.3.1"
    shadowLib "com.github.scribejava:scribejava-apis:6.9.0"
    shadowLib "com.github.scribejava:scribejava-core:6.9.0"
}

tasks.named("compileJava", JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

processResources {
    dependsOn configurations.commonResources
    from configurations.commonResources
    exclude "fabric.mod.json"
    exclude "minetogetherservers.accesswidener"

    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from zipTree(jar.archiveFile)
    exclude "fabric.mod.json"
    exclude "minetogetherservers.accesswidener"

    configurations = [project.configurations.shadowLib]
    archiveClassifier = null
    mergeServiceFiles()

    relocate "blue.endless", "net.creeperhost.minetogetherservers.repack.blue.endless"
    relocate "net.covers1624", "net.creeperhost.minetogetherservers.repack.net.covers1624"
    relocate "org.pircbotx", "net.creeperhost.minetogetherservers.repack.org.pircbotx"
    relocate "com.github.scribejava", "net.creeperhost.minetogetherservers.com.github.scribejava"
    relocate "fi.iki.elonen", "net.creeperhost.minetogetherservers.fi.iki.elonen"
    relocate "com.fasterxml.jackson", "net.creeperhost.minetogetherservers.com.fasterxml.jackson"
    relocate "net.creeperhost.minetogether.lib", "net.creeperhost.minetogetherservers.repack.minetogether.lib"
    relocate "net.creeperhost.minetogether.session", "net.creeperhost.minetogetherservers.repack.minetogether.session"
    archiveBaseName.set "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
}

assemble {
    dependsOn shadowJar
}

jar {
    archiveClassifier = "raw"
}

sourcesJar {
    dependsOn configurations.commonJava
    from configurations.commonJava
    dependsOn configurations.commonResources
    from configurations.commonResources
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}
