import org.jetbrains.gradle.ext.ActionDelegationConfig.TestRunner

plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.17.491" apply false
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.4.1"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    loom {
        // Enable Java assertions on all run configs
        runConfigs.each {
            it.vmArg '-ea'
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        localRuntime 'net.covers1624:DevLogin:0.1.0.5'
    }
}

allprojects {
    apply plugin: "java-library"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenLocal()
        maven {
            name "CreeperHost"
            url 'https://maven.creeperhost.net'
        }
        maven { url "https://maven.ftb.dev/releases" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
    }
}

// Why in gods name is Architectry forcing both these to Gradle.
// That is the most retarded thing I have ever seen, this framework needs to die in a hole.
afterEvaluate {
    idea.project.settings {
        delegateActions {
            // Give us non retarded unit testing and proper IDE integration.
            testRunner = TestRunner.PLATFORM
        }
    }
}
