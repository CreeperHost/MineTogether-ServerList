plugins {
    id "net.neoforged.moddev"
}

neoForge {
    neoFormVersion = rootProject.neo_form_version

    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at)
    }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly("net.creeperhost.polylib:polylib-neoforge:${polylib_version}") { transitive = false }
    accessTransformers("net.creeperhost.polylib:polylib-neoforge:${polylib_version}")
    implementation "blue.endless:jankson:${jankson_version}"
    implementation("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    implementation("net.creeperhost:MineTogetherSessions:${mtsession_version}") { transitive false }
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.github.scribejava:scribejava-apis:6.9.0'
    implementation 'com.github.scribejava:scribejava-core:6.9.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
