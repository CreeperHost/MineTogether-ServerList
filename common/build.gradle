architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/minetogetherservers.accesswidener")
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "dev.architectury:architectury:${rootProject.architectury_version}"

    implementation ("net.creeperhost.polylib:polylib-fabric:${polylib_version}") {
        transitive false
    }
    implementation "blue.endless:jankson:${jankson_version}"
    implementation("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    implementation("net.creeperhost:MineTogetherSessions:${mtsession_version}") {
        transitive false
    }

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.github.scribejava:scribejava-apis:6.9.0'
    implementation 'com.github.scribejava:scribejava-core:6.9.0'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'

//    modApi "dev.ftb.mods:ftb-pack-companion:${ftb_companion_version}"
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
