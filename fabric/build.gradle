plugins {
    id "com.gradleup.shadow" version "9.4.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        clientLogin {
            client()
            ideConfigGenerated true
            mainClass.set 'net.covers1624.devlogin.DevLogin'

            programArgs '--launch_target', 'net.fabricmc.loader.impl.launch.knot.KnotClient'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowLib
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    shadowCommon.extendsFrom shadowLib
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    implementation.extendsFrom shadowLib
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    implementation ("net.creeperhost.polylib:polylib-fabric:${polylib_version}")

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    shadowLib "blue.endless:jankson:${jankson_version}"
    shadowLib("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    shadowLib("net.creeperhost:MineTogetherSessions:${mtsession_version}") {
        transitive false
    }

    shadowLib 'org.nanohttpd:nanohttpd:2.3.1'
    shadowLib 'com.github.scribejava:scribejava-apis:6.9.0'
    shadowLib 'com.github.scribejava:scribejava-core:6.9.0'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
    mergeServiceFiles()

    relocate 'blue.endless', 'net.creeperhost.minetogetherservers.repack.blue.endless'
    relocate 'net.covers1624', 'net.creeperhost.minetogetherservers.repack.net.covers1624'
    relocate 'org.pircbotx', 'net.creeperhost.minetogetherservers.repack.org.pircbotx'
    relocate 'com.github.scribejava', 'net.creeperhost.minetogetherservers.com.github.scribejava'
    relocate 'fi.iki.elonen', 'net.creeperhost.minetogetherservers.fi.iki.elonen'
    // TODO can we switch scribejava to using Gson?
    relocate 'com.fasterxml.jackson', 'net.creeperhost.minetogetherservers.com.fasterxml.jackson'
    relocate 'net.creeperhost.minetogether.lib', 'net.creeperhost.minetogetherservers.repack.minetogether.lib'
    relocate 'net.creeperhost.minetogether.session', 'net.creeperhost.minetogetherservers.repack.minetogether.session'
    archiveBaseName.set "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
}

assemble {
    dependsOn shadowJar
}

jar {
    archiveClassifier = "raw"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}

